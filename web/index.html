<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F7F7F8" id="theme-color-meta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KnowledgeAnchor">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" type="image/png" href="/icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>KnowledgeAnchor</title>
  <script>
    // Set theme before first paint to avoid a flash of the wrong scheme.
    (function () {
      var saved = localStorage.getItem('ka-theme');
      var theme = saved === 'light' || saved === 'dark'
        ? saved
        : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/vendor/katex/katex.min.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="#/materials"><span class="brand-full">KnowledgeAnchor</span><span class="brand-short">KA</span></a>
      <nav class="nav">
        <a href="#/materials" data-nav="materials">资料</a>
        <a href="#/queue" data-nav="queue">今日复核</a>
        <a href="#/claims" data-nav="claims">全部 Claim</a>
        <a href="#/graph" data-nav="graph">图谱</a>
      </nav>
    </div>
    <div class="topbar-right">
      <button id="search-toggle" class="icon-btn mobile-only" type="button" aria-label="搜索" aria-expanded="false">搜索</button>
      <input id="search" class="search" type="search" placeholder="全文搜索，空格分隔多个关键词…" autocomplete="off" spellcheck="false" aria-label="全文搜索">
      <button id="refresh-data" class="icon-btn" type="button" title="重新读取文件">刷新</button>
      <a id="new-link" href="#/new" class="btn btn-sm" hidden>新建 claim</a>
      <button id="filter-toggle" class="icon-btn mobile-only" type="button" aria-label="筛选">筛选</button>
      <button id="theme-toggle" class="icon-btn" type="button" title="切换亮/暗主题">☾</button>
    </div>
  </header>

  <div id="drawer-overlay" class="drawer-overlay" hidden></div>

  <div id="app" class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <main id="main" class="main"></main>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="/vendor/markdown-it/markdown-it.min.js"></script>
  <script src="/vendor/katex/katex.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
